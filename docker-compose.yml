services:
  pc-parts-bot:
    build: .
    container_name: pc-parts-bot
    restart: unless-stopped

    # Secrets come from Portainer's "Environment variables" section
    # in the stack UI (or a local .env file if you're running this
    # with plain docker compose) - the ${...} syntax below pulls each
    # one in and passes it to the container. This avoids needing an
    # actual .env FILE to exist inside the deployed stack folder,
    # which Portainer's repository-based deploys don't provide.
    environment:
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET}
      # Tells database.py to store the SQLite file inside the
      # mounted volume below, instead of the container's ephemeral
      # filesystem
      - DB_PATH=/app/data/listings.db

    # This volume keeps listings.db on the Docker host's filesystem,
    # not inside the container. That way, if you rebuild or recreate
    # the container, your database of already-seen listings survives
    # and you won't get flooded with "new" alerts for things you've
    # already seen.
    volumes:
      - ./data:/app/data